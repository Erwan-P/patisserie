name: Security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://127.0.0.1:5432/security_test
      DIRECT_URL: postgresql://127.0.0.1:5432/security_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/check-secrets.mjs --history
      - run: npm audit --audit-level=high
      - run: npm run test:security
